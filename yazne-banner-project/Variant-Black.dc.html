<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>YAZNE - Banner Negra</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { text-decoration: none; }
</style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; position: relative; background: #0A0A0A; font-family: 'Inter', sans-serif; overflow: hidden;">

  <!-- full-bleed photo, desaturated/duotone to unify with brand palette -->
  <img src="https://cdn.shopify.com/s/files/1/0851/4329/0112/files/A86FF26A-0F5D-4220-8726-5A94747BF07D.png?v=1789809402" alt="Bolsa YAZNE negra con pañoleta y dije de estrella" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; filter: grayscale(0.25) contrast(1.08) brightness(0.92);">

  <!-- directional wash, heavier top for headline, heavier bottom for CTA -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,0.75) 0%, rgba(10,10,10,0.1) 26%, rgba(10,10,10,0) 55%, rgba(10,10,10,0.85) 100%);"></div>

  <!-- silver tint overlay for brand cohesion -->
  <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(183,188,194,0.12), rgba(10,10,10,0) 60%); mix-blend-mode: overlay;"></div>

  <!-- fine grain -->
  <div style="position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay; background-image: repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px), repeating-linear-gradient(90deg, #fff 0px, transparent 1px, transparent 2px); background-size: 3px 3px;"></div>

  <!-- top brand mark + vertical divider line, asymmetric -->
  <div style="position: absolute; top: 52px; left: 56px; right: 56px; z-index: 3; display: flex; justify-content: space-between; align-items: baseline;">
    <div style="font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: #FFFFFF; font-weight: 500;">Yazne</div>
    <div style="font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.55);">01 &nbsp;/&nbsp; Colección</div>
  </div>

  <!-- oversized headline, right-aligned, overlapping the lower photo area -->
  <div style="position: absolute; right: 56px; bottom: 150px; z-index: 3; text-align: right; max-width: 760px;">
    <div style="font-family: 'Fraunces', serif; font-weight: 300; font-style: italic; font-size: 92px; line-height: 0.98; color: #FFFFFF; letter-spacing: -0.01em;">Tu nueva <span style="font-weight: 500; font-style: normal;">bolsita</span><br>favorita</div>
  </div>

  <!-- bottom bar: CTA left, secondary link right -->
  <div style="position: absolute; left: 56px; right: 56px; bottom: 56px; z-index: 3; display: flex; justify-content: space-between; align-items: center;">
    <a href="#" style="display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; border-bottom: 1px solid #FFFFFF; padding-bottom: 6px;">
      Comprar ahora <span style="font-size: 15px;">&rarr;</span>
    </a>
    <a href="#" style="color: rgba(255,255,255,0.75); font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.08em;">Arma tu bolsa</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
