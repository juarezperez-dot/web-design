<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>YAZNE - Banner Rosa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { text-decoration: none; }
</style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; position: relative; background: #121212; font-family: 'Inter', sans-serif; overflow: hidden;">

  <!-- full-bleed photo -->
  <img src="https://cdn.shopify.com/s/files/1/0851/4329/0112/files/IMG-7695.png?v=1789810332" alt="Bolsa YAZNE rosa con pañoleta y dije de estrella" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% center;">

  <!-- duotone wash: warm-neutral over the photo, stronger toward the left where type sits -->
  <div style="position: absolute; inset: 0; background: linear-gradient(100deg, rgba(18,18,18,0.88) 0%, rgba(18,18,18,0.55) 30%, rgba(18,18,18,0.04) 52%, rgba(18,18,18,0) 70%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 38%);"></div>

  <!-- fine grain texture -->
  <div style="position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay; background-image: repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px), repeating-linear-gradient(90deg, #fff 0px, transparent 1px, transparent 2px); background-size: 3px 3px;"></div>

  <!-- top-left brand mark, no icon -->
  <div style="position: absolute; top: 56px; left: 56px; z-index: 3;">
    <div style="font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: #FFFFFF; font-weight: 500;">Yazne</div>
    <div style="width: 34px; height: 1px; background: #FFFFFF; margin-top: 10px; opacity: 0.7;"></div>
  </div>

  <!-- oversized overlapping headline, bottom-left, true editorial scale -->
  <div style="position: absolute; left: 56px; bottom: 150px; z-index: 3; max-width: 640px;">
    <div style="font-family: 'Fraunces', serif; font-weight: 300; font-style: italic; font-size: 104px; line-height: 0.96; color: #FFFFFF; letter-spacing: -0.01em;">Tu nueva<br><span style="font-weight: 500; font-style: normal;">bolsita</span><br>favorita</div>
  </div>

  <!-- subcopy + single CTA, bottom bar -->
  <div style="position: absolute; left: 56px; bottom: 56px; z-index: 3; display: flex; align-items: center; gap: 28px;">
    <a href="#" style="display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; border-bottom: 1px solid #FFFFFF; padding-bottom: 6px;">
      Comprar ahora <span style="font-size: 15px;">&rarr;</span>
    </a>
    <a href="#" style="color: rgba(255,255,255,0.75); font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.08em;">Arma tu bolsa</a>
  </div>

  <!-- right-edge vertical tag -->
  <div style="position: absolute; right: 48px; top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: center; z-index: 3; font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.55); white-space: nowrap;">Hecho a mano &mdash; Edición limitada</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
